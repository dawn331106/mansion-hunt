# Publish the game to GitHub Pages on every push to main.
#
# The game is static files and its multiplayer is peer-to-peer, so there is
# nothing to run server-side and nothing to pay for: Pages serves the bundle,
# PeerJS's public broker introduces players to each other, and the traffic then
# goes directly between them.
name: Deploy

on:
  push:
    branches: [main]
  # Lets you publish by hand from the Actions tab without pushing.
  workflow_dispatch:

# The minimum Pages needs: read the repo, write the site, prove who we are.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` so a run that is already
# publishing is allowed to finish rather than leaving the site half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Typecheck before building. A deploy that ships a type error is worse
      # than a deploy that fails, because the failure is at least visible.
      - run: npm run check

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
